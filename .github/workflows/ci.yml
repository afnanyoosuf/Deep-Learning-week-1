name: Deep Learning CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Use CPU-only PyTorch wheel — GPU isn't available on ubuntu-latest runners,
          # and CUDA wheels are much larger/slower to download.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-docker.txt

      - name: Verify PyTorch installation
        run: |
          python -c 'import torch; print("PyTorch:", torch.__version__)'
          python -c 'import torchvision; print("Torchvision:", torchvision.__version__)'
          python -c 'import torch; print("CUDA available:", torch.cuda.is_available())'

      - name: Lint / syntax check
        run: |
          python -m compileall src

      - name: Run tests
        run: |
          pip install pytest
          pytest --maxfail=1 --disable-warnings -q

      - name: Pull DVC data
        run: |
          dvc pull || echo "No DVC remote configured or nothing to pull"

      - name: Check DVC pipeline status
        run: |
          dvc
